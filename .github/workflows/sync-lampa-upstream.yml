name: Sync Lampa upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Siaivo/siaivo.github.io.git
          git fetch upstream main

      - name: Merge upstream main
        run: git merge --no-edit upstream/main

      - name: Reapply Lampa UA customizations
        run: node scripts/apply-lampaua-customizations.mjs

      - name: Check Ukrainian localization
        run: node scripts/check-ukrainian-localization.mjs

      - name: Commit customizations when needed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add app.min.js css/app.css lang/uk.js scripts/apply-lampaua-customizations.mjs scripts/check-ukrainian-localization.mjs
            git commit -m "Apply Lampa UA customizations"
          fi

      - name: Push updated fork
        run: git push origin main

      - name: Close failure issue after successful sync
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Sync Lampa upstream failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing_issue="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --search "${ISSUE_TITLE} in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${existing_issue}" ]; then
            gh issue comment "${existing_issue}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Наступна синхронізація пройшла успішно: ${RUN_URL}"
            gh issue close "${existing_issue}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment "Закриваю, бо sync з upstream знову проходить успішно."
          fi

      - name: Create or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Sync Lampa upstream failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cat > failure-issue.md <<EOF
          Автоматична синхронізація з Siaivo/siaivo.github.io не пройшла.

          Ймовірні причини:
          - конфлікт під час merge з upstream/main;
          - змінилася структура app.min.js або css/app.css і скрипт не зміг накласти наш блок;
          - тимчасова помилка GitHub Actions або GitHub API.

          Run: ${RUN_URL}
          Branch: ${BRANCH_NAME}

          Потрібно вручну перевірити workflow, вирішити конфлікт або поправити scripts/apply-lampaua-customizations.mjs.
          EOF

          existing_issue="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --search "${ISSUE_TITLE} in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${existing_issue}" ]; then
            gh issue comment "${existing_issue}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body-file failure-issue.md
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${ISSUE_TITLE}" \
              --body-file failure-issue.md
          fi
